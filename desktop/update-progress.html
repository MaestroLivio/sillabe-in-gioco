<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Aggiornamento</title>
<style>
  :root {
    --blu: #4a90e2;
    --blu-scuro: #2f6fb5;
    --carta: #eaf5ff;
    --testo: #12324d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    padding: 26px 28px;
    background: var(--carta);
    color: var(--testo);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
  }
  .spiega {
    margin: 0;
    font-size: 0.82rem;
    line-height: 1.45;
    opacity: 0.78;
  }
  .barra {
    height: 14px;
    border-radius: 999px;
    background: rgba(74, 144, 226, 0.18);
    overflow: hidden;
  }
  .riempimento {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--blu), var(--blu-scuro));
    transition: width 0.16s linear;
  }
  .riga {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.78rem;
  }
  .etichetta { opacity: 0.85; font-variant-numeric: tabular-nums; }
  button {
    font: inherit;
    font-size: 0.78rem;
    padding: 7px 14px;
    border-radius: 9px;
    border: 1px solid rgba(18, 50, 77, 0.22);
    background: #fff;
    color: var(--testo);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #f4f9ff; }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible { outline: 3px solid var(--blu); outline-offset: 2px; }
</style>
</head>
<body>
  <h1>Scarico l'aggiornamento</h1>
  <p class="spiega">Puoi continuare a usare l'app: il download procede in background.</p>
  <div class="barra" role="progressbar" id="barra" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="riempimento" id="riempimento"></div>
  </div>
  <div class="riga">
    <span class="etichetta" id="etichetta" role="status" aria-live="polite">Preparazione…</span>
    <button id="annulla" type="button">Annulla</button>
  </div>
<script>
"use strict";
/* Il processo principale chiama window.setProgress({percent, label, cancelable}). */
const barra = document.getElementById("barra");
const riempimento = document.getElementById("riempimento");
const etichetta = document.getElementById("etichetta");
const annulla = document.getElementById("annulla");

window.setProgress = function (payload) {
  const percent = Math.max(0, Math.min(100, Math.round(payload.percent || 0)));
  riempimento.style.width = percent + "%";
  barra.setAttribute("aria-valuenow", String(percent));
  if (payload.label) etichetta.textContent = payload.label;
  annulla.disabled = !payload.cancelable;
};

annulla.addEventListener("click", () => {
  annulla.disabled = true;
  etichetta.textContent = "Annullamento…";
  /* il preload espone solo questa funzione */
  if (window.updateBridge && window.updateBridge.cancel) window.updateBridge.cancel();
});
</script>
</body>
</html>
