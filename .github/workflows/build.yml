name: Build e rilascio

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validazione contenuti e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm ci || npm install

      - name: Valida i 40 livelli
        run: npm run validate

      - name: Genera icone
        run: npm run icons

  test:
    name: Smoke test (headless)
    runs-on: macos-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm ci || npm install

      - name: Test end-to-end
        run: npm test
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: "1"

  build:
    name: Build ${{ matrix.os }}
    needs: [validate, test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm ci || npm install

      - name: Icone
        run: npm run icons && npm run icons:native

      - name: Pacchetto web e ChromeOS
        run: npm run build:web

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux

      - name: Carica artefatti
        uses: actions/upload-artifact@v4
        with:
          name: distribuzione-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Pubblica la release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica gli artefatti
        uses: actions/download-artifact@v4
        with:
          path: artefatti
          merge-multiple: true

      - name: Crea la release
        uses: softprops/action-gh-release@v2
        with:
          files: artefatti/*
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
