<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8f0ff"/>
      <stop offset="100%" stop-color="#8fc9f5"/>
    </linearGradient>
    <linearGradient id="tv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d8b82"/>
      <stop offset="100%" stop-color="#1d4a45"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#ffe9c4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <circle cx="404" cy="112" r="52" fill="#ffd45e" opacity=".9"/>
  <ellipse cx="126" cy="104" rx="62" ry="30" fill="#fff" opacity=".85"/>
  <ellipse cx="180" cy="94" rx="44" ry="26" fill="#fff" opacity=".85"/>

  <!-- TV -->
  <rect x="86" y="126" width="340" height="238" rx="44" fill="url(#tv)"/>
  <rect x="106" y="146" width="300" height="182" rx="28" fill="#0e1f1d"/>
  <rect x="122" y="160" width="268" height="154" rx="20" fill="#eaf6ff"/>
  <text x="256" y="238" font-family="Trebuchet MS, Verdana, sans-serif" font-size="74" font-weight="bold" fill="#2f6cb3" text-anchor="middle">SI</text>
  <text x="256" y="284" font-family="Trebuchet MS, Verdana, sans-serif" font-size="38" font-weight="bold" fill="#3fae5a" text-anchor="middle">LLA</text>
  <circle cx="392" cy="340" r="12" fill="#cfe9e4"/>
  <circle cx="358" cy="340" r="12" fill="#cfe9e4"/>

  <!-- legs -->
  <rect x="150" y="360" width="30" height="40" rx="10" fill="#1d4a45"/>
  <rect x="332" y="360" width="30" height="40" rx="10" fill="#1d4a45"/>

  <!-- tiles -->
  <g>
    <rect x="92" y="392" width="106" height="76" rx="20" fill="url(#tile)" stroke="#f59a2a" stroke-width="8"/>
    <text x="145" y="443" font-family="Trebuchet MS, Verdana, sans-serif" font-size="40" font-weight="bold" fill="#a3640a" text-anchor="middle">BA</text>
    <rect x="210" y="392" width="106" height="76" rx="20" fill="url(#tile)" stroke="#f59a2a" stroke-width="8"/>
    <text x="263" y="443" font-family="Trebuchet MS, Verdana, sans-serif" font-size="40" font-weight="bold" fill="#a3640a" text-anchor="middle">CO</text>
    <rect x="328" y="392" width="106" height="76" rx="20" fill="url(#tile)" stroke="#f59a2a" stroke-width="8"/>
    <text x="381" y="443" font-family="Trebuchet MS, Verdana, sans-serif" font-size="40" font-weight="bold" fill="#a3640a" text-anchor="middle">LU</text>
  </g>
